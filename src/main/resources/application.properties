# Database credentials are supplied by the environment, never committed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym_management}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Only health and the Prometheus scrape endpoint are exposed.
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=gymms
